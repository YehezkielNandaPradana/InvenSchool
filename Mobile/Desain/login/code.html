                    "tertiary-fixed": "#eaddff",
                    "surface-container-low": "#f3f4f5",
                    "inverse-surface": "#2e3132",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#e1e3e4",
                    "outline": "#737686",
                    "inverse-on-surface": "#f0f1f2",

                    "surface-container-high": "#e7e8e9",

                    "on-primary": "#ffffff",
                    "surface": "#f8f9fa",

<style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            transition: transform 0.2s ease-in-out;
        }
        .bg-mesh {
            background-color: #f8f9fa;
            background-image: radial-gradient(at 0% 0%, hsla(221, 83%, 93%, 1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(221, 83%, 96%, 1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(221, 83%, 93%, 1) 0, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-mesh min-h-screen flex flex-col items-center justify-center p-md">
<!-- Container for the entire layout to manage vertical flow -->
<div class="w-full max-w-md flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-lg flex flex-col items-center animate-fade-in-down">
<div class="bg-primary-container text-on-primary-container w-16 h-16 rounded-2xl flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-[40px]">inventory_2</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">
                InvenSchool
            </h1>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest w-full rounded-2xl p-xl login-card border border-outline-variant/30">
<div class="mb-xl text-center">
<h2 class="font-title-lg text-title-lg text-on-surface mb-xs">Selamat Datang Kembali</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk ke akun inventaris Anda</p>
</div>
<form class="space-y-lg" id="loginForm">
<!-- Username/Email Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant px-xs" for="identity">Email atau Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<input class="block w-full pl-11 pr-md py-3 bg-surface-bright border border-outline-variant rounded-xl text-on-surface font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline-variant" id="identity" name="identity" placeholder="nama@sekolah.sch.id" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="password">Kata Sandi</label>
<a class="font-label-lg text-label-lg text-primary hover:underline transition-all" href="#">Lupa Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="block w-full pl-11 pr-11 py-3 bg-surface-bright border border-outline-variant rounded-xl text-on-surface font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface-variant transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordVisibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-lg text-label-lg py-4 rounded-xl shadow-sm hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-xl" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
</div>
<!-- Footer -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Belum punya akun? 
                <a class="text-primary font-bold hover:underline" href="#">Hubungi Admin</a>
</p>
</div>
<!-- Decorative Info Section -->
<div class="mt-12 grid grid-cols-2 gap-md w-full max-w-sm opacity-50">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="text-xs font-medium">Data Terenkripsi</span>
</div>
<div class="flex items-center gap-xs text-on-surface-variant justify-end">
<span class="material-symbols-outlined text-sm">update</span>
<span class="text-xs font-medium">v1.0.4 Release</span>
</div>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordVisibilityIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Add a simple button loading state on submit
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="ml-2">Memproses...</span>
            `;
            
            // Simulation of login
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                alert('Sistem sedang dalam mode demo. Hubungi admin untuk akses penuh.');
            }, 1500);
        });
    </script>
</body></html>
