name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install dependencies
        run: |
          cd Api
          composer install --no-interaction --prefer-dist
      - name: Run PHP tests
        run: |
          cd Api
          php artisan test

  mobile-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
      - name: Install dependencies
        run: |
          cd Mobile
          flutter pub get
      - name: Analyze
        run: |
          cd Mobile
          flutter analyze
